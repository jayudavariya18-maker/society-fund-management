name: bajrang
description: "A Complete Multilingual Society Finance & Festival Management Application for Residential Societies"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Supabase Backend
  supabase_flutter: ^2.5.6

  # Formatting & Localization
  intl: ^0.19.0

  # Charts & Visuals
  fl_chart: ^0.68.0

  # Images & Files
  cached_network_image: ^3.3.1
  file_picker: ^8.0.3
  image_picker: ^1.1.1

  # Document Generation & Printing
  pdf: ^3.10.8
  printing: ^5.13.0

  # Storage & Utilities
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
